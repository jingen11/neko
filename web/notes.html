<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>neko notes</title>
<meta name="theme-color" content="#eef3f9">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
<nav class="rail glass" aria-label="Main">
  <a class="logo-link" href="/" aria-label="neko"><img class="logo" src="/icons/logo.png" alt="" width="44" height="44"></a>
  <div class="rail-nav">
    <a class="rail-btn" href="/" aria-label="Practice" title="Practice"><img src="/icons/dashboard.png" alt=""></a>
    <a class="rail-btn" href="/notes.html" aria-current="page" aria-label="Notes" title="Notes"><img src="/icons/schedules.png" alt=""></a>
    <a class="rail-btn" href="/lab.html" aria-label="Voice lab" title="Voice lab"><img src="/icons/devices.png" alt=""></a>
    <a class="rail-btn" href="https://dash.home.je-dev.com" aria-label="Home dashboard" title="Home dashboard"><img src="/icons/home.png" alt=""></a>
  </div>
  </nav>

<main class="canvas">
  <header class="title">
    <div>
    <h1>Notes</h1>
    <p class="sub">Your learning record, as it is in the vault. Every sentence, translation, question and review is written here. To ask what you've learnt, use the Hermes tab on the practice page.</p>
    </div>
  </header>

  <div class="notes">
    <nav class="panel note-list" aria-label="Notes">
      <div class="head"><h2>Files</h2><span id="noteCount" class="meta"></span></div>
      <label for="noteFilter" class="sr">Filter notes</label>
      <input id="noteFilter" class="filter" type="search" placeholder="Filter by name">
      <div id="files"><p class="empty">Loading…</p></div>
    </nav>
    <article class="panel note-view" aria-live="polite">
      <div class="head note-head">
        <h2 id="notePath">No note open</h2>
        <div class="actions">
          <button id="copyBtn" class="chip-btn" type="button" disabled>Copy markdown</button>
          <a id="downloadBtn" class="chip-btn" aria-disabled="true">Download .md</a>
        </div>
      </div>
      <div id="note" class="md"><p class="empty">Pick a note on the left.</p></div>
    </article>
  </div>
</main>

<div id="toast" role="status" hidden></div>
<script type="module" src="/src/notes.ts"></script>
</body>
</html>
