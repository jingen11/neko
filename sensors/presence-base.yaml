# Shared by every presence board. Each board file sets `name` in substitutions,
# its IP secret, and includes this as a package.
esphome:
  name: ${name}

esp32:
  variant: esp32c6
  framework:
    type: esp-idf        # the C6 needs esp-idf, not Arduino

logger:
ota:
  - platform: esphome
    password: !secret ota_pw

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_pw

mqtt:
  broker: !secret mqtt_broker   # the box's router IP, not the Tailscale one
  username: ${name}             # each board has its own Mosquitto user, named after it
  password: !secret mqtt_pw

# HMMD 24 GHz mmWave (S3KM1110). It streams text lines ~10x a second:
#   "ON" / "OFF"   presence
#   "Range <cm>"   distance to the detected person, only while ON
uart:
  id: mmwave_uart
  tx_pin: GPIO16   # board TX -> sensor RX
  rx_pin: GPIO17   # board RX <- sensor TX
  baud_rate: 115200
  rx_buffer_size: 512

interval:
  - interval: 100ms
    then:
      - lambda: |-
          static std::string line;
          uint8_t c;
          while (id(mmwave_uart).available() && id(mmwave_uart).read_byte(&c)) {
            if (c == '\n') {
              if (!line.empty() && line.back() == '\r') line.pop_back();
              if (line == "ON") id(occupied).publish_state(true);
              else if (line == "OFF") id(occupied).publish_state(false);
              else if (line.rfind("Range ", 0) == 0) id(distance).publish_state(atoi(line.c_str() + 6));
              line.clear();
            } else if (c != 0 && line.size() < 64) {   // skip stray NUL bytes from line glitches
              line += (char) c;
            }
          }

binary_sensor:
  - platform: template
    id: occupied
    name: Occupied           # -> ${name}/binary_sensor/occupied/state  ON | OFF
    device_class: occupancy

sensor:
  - platform: template
    id: distance
    name: Distance           # -> ${name}/sensor/distance/state  cm
    unit_of_measurement: cm
    accuracy_decimals: 0
    update_interval: never   # pushed by the UART parser above
    filters:
      - median:              # drop one-off spikes (e.g. a 27 -> 270 -> 27 jump)
          window_size: 5
          send_every: 1
      - throttle_average: 1s # at most one value a second, averaged over it
      - delta: 15            # and only when it moved 15 cm or more
