# Shared by every presence board. Each board file sets `name` in substitutions,
# its IP secret, and includes this as a package. A board file can also override
# `max_range_cm` in its own substitutions.
substitutions:
  max_range_cm: "300"   # detections farther than this count as nobody there
  agree_window_ms: "5000"  # Intruder: how long after a PIR pulse the mmWave may still come on and agree
  intruder_hold: "10s"     # Intruder stays ON this long after the sensors last agreed

esphome:
  name: ${name}

esp32:
  variant: esp32c6
  framework:
    type: esp-idf        # the C6 needs esp-idf, not Arduino

logger:
ota:
  - platform: esphome
    password: !secret ota_pw

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_pw

mqtt:
  broker: !secret mqtt_broker   # the box's router IP, not the Tailscale one
  username: ${name}             # each board has its own Mosquitto user, named after it
  password: !secret mqtt_pw

# HMMD 24 GHz mmWave (S3KM1110). It streams text lines ~10x a second:
#   "ON" / "OFF"   presence
#   "Range <cm>"   distance to the detected person, only while ON
# Receive only: no wire from the board to the sensor's RX. GPIO16/17 are the C6's UART0 pins, where its
# boot ROM prints at 115200 baud on every start; a sensor powering up with the board (a power cut, unplugging)
# takes that as input and stays silent until it is power-cycled on its own. Nothing here sends to the sensor;
# only hmmd-read.yaml does, over a wire put back for it.
uart:
  id: mmwave_uart
  rx_pin: GPIO17   # board RX <- sensor TX
  # Keeps the last chunk received for "UART last", non-text bytes as <hex>
  debug:
    direction: RX
    after:
      delimiter: "\n"
      timeout: 50ms        # binary frames have no newline: cut them on a pause instead
    sequence:
      - lambda: |-
          std::string s;
          char h[4];
          for (uint8_t b : bytes) {
            if (b >= 32 && b < 127) s += (char) b;
            else { snprintf(h, sizeof h, "%02X", b); s += "<"; s += h; s += ">"; }
          }
          id(uart_last) = s.substr(0, 120);
  baud_rate: 115200
  rx_buffer_size: 512

interval:
  - interval: 100ms
    then:
      - lambda: |-
          static std::string line;
          uint8_t c;
          while (id(mmwave_uart).available() && id(mmwave_uart).read_byte(&c)) {
            if (c == '\n') {
              if (!line.empty() && line.back() == '\r') line.pop_back();
              // "ON" is always followed by a "Range" line, so presence is decided there:
              // a person beyond max_range_cm (another room, through a wall) counts as absent.
              if (line == "OFF") {
                id(mmwave).publish_state(false);
              } else if (line.rfind("Range ", 0) == 0) {
                int cm = atoi(line.c_str() + 6);
                bool near = cm <= ${max_range_cm};
                id(mmwave).publish_state(near);
                if (near) id(distance).publish_state(cm);
              }
              line.clear();
            } else if (c != 0 && line.size() < 64) {   // skip stray NUL bytes from line glitches
              line += (char) c;
            }
          }

binary_sensor:
  # mmWave presence within max_range_cm, set by the UART parser above. Not published on its own.
  - platform: template
    id: mmwave
    internal: true
    on_press:
      # the mmWave can pick someone up just after the PIR pulse: still counts as both agreeing
      - if:
          condition:
            lambda: return id(last_pir_ms) != 0 && millis() - id(last_pir_ms) <= ${agree_window_ms};
          then:
            - script.execute: intruder_seen

  # Someone is there if either sensor says so: the mmWave sees people sitting still,
  # the PIR catches movement the mmWave misses (or ignores beyond max_range_cm).
  - platform: template
    id: occupied
    name: Occupied           # -> ${name}/binary_sensor/occupied/state  ON | OFF
    device_class: occupancy
    lambda: return id(mmwave).state || id(pir).state;
    filters:
      - delayed_off: 5s      # a one-off far reading (e.g. 661 cm spike) mustn't flip it OFF

  # AM312 mini PIR. OUT goes HIGH (3.3 V) for ~2 s on motion; needs ~30-60 s warm-up after power-on.
  - platform: gpio
    id: pir
    name: PIR                # -> ${name}/binary_sensor/pir/state  ON | OFF
    pin:
      number: GPIO5
      mode: INPUT            # AM312 drives the pin both HIGH and LOW; a pull-down drags its weak HIGH below the C6's threshold
    device_class: motion
    on_press:
      - lambda: id(last_pir_ms) = millis();
      - if:
          condition:
            binary_sensor.is_on: mmwave
          then:
            - script.execute: intruder_seen

  # Someone for sure: the PIR fired and the mmWave agrees (on at that moment, or within agree_window_ms after).
  # Either sensor alone can be fooled (the mmWave by a fan or curtain, the PIR by heat), both at once rarely are.
  # The PIR pulse is only ~2 s, so this holds ON for intruder_hold to make one clear event per person.
  # The home server's alarm counts only this on a board that has it; Occupied and PIR are still logged.
  - platform: template
    id: intruder
    name: Intruder           # -> ${name}/binary_sensor/intruder/state  ON | OFF
    device_class: occupancy

globals:
  - id: uart_last            # the last chunk the mmWave sent, for the "UART last" diagnostic
    type: std::string
    restore_value: false
  - id: last_pir_ms          # millis() of the last PIR pulse; 0 = none yet
    type: uint32_t
    restore_value: false
    initial_value: "0"

script:
  - id: intruder_seen
    mode: restart            # another agreement while ON keeps it ON for a fresh intruder_hold
    then:
      - binary_sensor.template.publish:
          id: intruder
          state: ON
      - delay: ${intruder_hold}
      - binary_sensor.template.publish:
          id: intruder
          state: OFF

sensor:
  - platform: template
    id: distance
    name: Distance           # -> ${name}/sensor/distance/state  cm
    unit_of_measurement: cm
    accuracy_decimals: 0
    update_interval: never   # pushed by the UART parser above
    filters:
      - median:              # drop one-off spikes (e.g. a 27 -> 270 -> 27 jump)
          window_size: 5
          send_every: 1
      - throttle_average: 1s # at most one value a second, averaged over it
      - delta: 15            # and only when it moved 15 cm or more

text_sensor:
  # What the mmWave last sent, e.g. "Range 105<0D><0A>" or "OFF<0D><0A>". It stops changing when the sensor goes
  # silent (a loose wire, or stuck after powering up with the board). Diagnostic, so neko-home's alarm log skips it.
  - platform: template
    name: UART last          # -> ${name}/sensor/uart_last/state
    entity_category: diagnostic
    update_interval: 2s
    lambda: return id(uart_last);
